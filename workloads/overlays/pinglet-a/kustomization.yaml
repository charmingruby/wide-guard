# yaml-language-server: $schema=none
namespace: pinglet-a
namePrefix: pinglet
labels:
  - pairs:
      app.kubernetes.io/instance: pinglet
      app.kubernetes.io/version: a
    includeSelectors: true

resources:
  - ../../base

configMapGenerator:
  - name: config
    literals:
      - PORT=4000
      - ID=a1
      - IS_AVAILABLE=true
      - PING_DELAY_MS=0
      - PONG_DELAY_MS=0
      - PING_FAILURE_RATE=0
      - PONG_FAILURE_RATE=0
      - INJECT_STATUS_CODE=500
