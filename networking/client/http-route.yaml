apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinglet
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: pinglet
      port: 80
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/pong
          method: POST
      timeouts:
        request: 4s
      backendRefs:
        - name: pinglet
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/ping
          method: POST
      timeouts:
        request: 4s
      backendRefs:
        - name: pinglet
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/chain
          method: POST
      timeouts:
        request: 10s
      backendRefs:
        - name: pinglet
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/relay
          method: POST
      timeouts:
        request: 10s
      backendRefs:
        - name: pinglet
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/healthz
          method: GET
      timeouts:
        request: 2s
      backendRefs:
        - name: pinglet
          port: 80
