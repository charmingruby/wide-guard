apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-same-namespace
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: client-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts: [client/pinglet]
      to:
        - operation:
            ports: ["80"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-from-server
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: client-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts: [server/pinglet]
      to:
        - operation:
            methods: [GET]
            paths: [/api/healthz]
            ports: ["80"]
