apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: dr
  labels:
    app.kubernetes.io/version: V1
spec:
  host: pinglet-a-svc.pinglet-a.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 120s
      maxEjectionPercent: 100
    tls:
      mode: ISTIO_MUTUAL
