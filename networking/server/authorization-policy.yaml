apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-same-namespace
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: server-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts: [server/pinglet]
      to:
        - operation:
            ports: ["80"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-from-client
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: server-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts: [client/pinglet]
      to:
        - operation:
            methods: [POST]
            paths: [/api/pong]
            ports: ["80"]
    - from:
        - source:
            serviceAccounts: [client/pinglet]
      to:
        - operation:
            methods: [POST]
            paths: [/api/relay]
            ports: ["80"]
