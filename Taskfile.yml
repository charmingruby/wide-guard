# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

env:
  CLUSTER_NAME: wide-guard

tasks:
  create-cluster:
    desc: "Creates a Kind cluster from config file"
    cmd: kind create cluster --config cluster.yaml --name {{.CLUSTER_NAME}}
  delete-cluster:
    desc: "Delete Kind cluster"
    cmd: kind delete cluster --name {{.CLUSTER_NAME}}
  apply-ns:
    desc: "Applies namespaces"
    cmd: kubectl apply -k namespaces
  apply-infra:
    desc: "Applies infrastructure, waits for readiness"
    cmds:
      - kubectl apply -k infra
      - kubectl wait --for=condition=available deployment/prometheus -n istio-system --timeout=120s
      - kubectl wait --for=condition=available deployment/jaeger -n istio-system --timeout=120s
      - kubectl wait --for=condition=available deployment/kiali -n istio-system --timeout=120s
      - kubectl wait --for=condition=available deployment/grafana -n istio-system --timeout=120s
  apply-workloads:
    desc: "Applies workloads manifests"
    cmd: kubectl apply -k workloads
  apply-networking:
    desc: "Applies networking manifests"
    cmds:
      - kubectl apply -k networking
  apply:
    desc: "Apply kustomize root"
    cmds:
      - task: apply-ns
      - task: apply-infra
      - task: apply-workloads
      - task: apply-networking
  install-istio:
    desc: "Installs Istio to the current cluster"
    cmd: istioctl install --set profile=ambient --skip-confirmation
  install-k8s-gateway-crds:
    desc: "Installs Kubernetes Gateway CRDs"
    cmd: kubectl get crd gateways.gateway.networking.k8s.io &> /dev/null || kubectl kustomize "github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.6.0" | kubectl apply -f -
  load-test:
    desc: "Runs a simple load test on pinglets to check o11y on Kiali"
    cmd: kubectl run -it fortio -n pinglet-a --rm --image=fortio/fortio -- load -c 32 -qps 8000 -t 60s http://pinglet.pinglet-a/api/healthz
  load-test-ping:
    desc: "Runs a pingpong load test to check o11y on Kiali"
    cmd: kubectl run -it fortio -n pinglet-{{.from}} --rm --image=fortio/fortio --overrides='{"spec":{"serviceAccountName":"pinglet"}}' -- load -c 32 -qps 8000 -t 60s -content-type "application/json" -payload '{"url":"http://pinglet.pinglet-{{.to}}.svc.cluster.local/api","path":"/pong"}' http://pinglet.pinglet-{{.from}}.svc.cluster.local/api/ping
  default:
    desc: "Scaffolds cluster, applying all needed infrastructure and manifests"
    cmds:
      - task: create-cluster
      - task: install-k8s-gateway-crds
      - task: install-istio
      - task: apply
  reset:
    desc: "Recreates and scaffolds the cluster"
    cmds:
      - task: delete-cluster
      - task: default
  pf-grafana:
    desc: "Port forwards Grafana"
    cmd: "kubectl port-forward svc/grafana 3000:3000 -n istio-system"
  pf-kiali:
    desc: "Port forwards Kiali"
    cmd: "kubectl port-forward svc/kiali 3001:20001 -n istio-system"
